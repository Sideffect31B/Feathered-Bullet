<style>
    :root {
        --logo-gold: #C8A95B;
        --logo-gold-hover: #E0BE6B;
        --black: #050505;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--black);
        color: #fff;
        overflow-x: hidden;
    }

    .site-header {
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.96);
        border-bottom: 1px solid rgba(200, 169, 91, 0.25);
    }

    .header-top {
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
    }

    .logo {
        width: 200px;
        height: auto;
        display: block;
    }

    .top-nav {
        display: flex;
        align-items: center;
        gap: 32px;
    }

    .top-nav a,
    .category-bar a {
        color: var(--logo-gold);
        text-decoration: none;
        text-transform: uppercase;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        transition: 0.3s ease;
    }

    .top-nav a:hover,
    .category-bar a:hover {
        color: var(--logo-gold-hover);
    }

    .category-bar {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 42px;
        background: rgba(0, 0, 0, 0.98);
        border-top: 1px solid rgba(200, 169, 91, 0.15);
    }

    .category-bar a {
        font-size: 13px;
    }

    .hero {
        min-height: 100vh;
        background:
            linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)),
            url("brand/hero-image.png");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        display: flex;
        align-items: center;
        padding: 165px 60px 40px;
    }

    .hero-content {
        max-width: 760px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(200, 169, 91, 0.25);
        border-radius: 20px;
        padding: 45px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.65);
    }

    .hero-content h1 {
        font-size: 72px;
        line-height: 1;
        margin-bottom: 24px;
        color: var(--logo-gold);
        text-transform: uppercase;
        letter-spacing: 3px;
    }

    .hero-content p {
        font-size: 21px;
        line-height: 1.7;
        color: #ddd;
        max-width: 650px;
        margin-bottom: 35px;
    }

    .btn {
        display: inline-block;
        background: var(--logo-gold);
        color: #000;
        padding: 16px 34px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 700;
        text-transform: uppercase;
        transition: 0.3s;
    }

    .btn:hover {
        background: var(--logo-gold-hover);
        transform: translateY(-2px);
    }

    section {
        padding: 80px 60px;
    }

    .section-title {
        text-align: center;
        color: var(--logo-gold);
        font-size: 36px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 50px;
    }

    .products,
    .themes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 30px;
    }

    .product-card,
    .theme-card {
        background: rgba(18, 18, 18, 0.92);
        border: 1px solid rgba(200, 169, 91, 0.25);
        border-radius: 18px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.55);
        transition: 0.3s;
    }

    .product-card {
        padding: 25px;
        text-align: center;
    }

    .product-card:hover,
    .theme-card:hover {
        transform: translateY(-5px);
        border-color: rgba(200, 169, 91, 0.55);
    }

    .product-image {
        height: 190px;
        background: linear-gradient(135deg, #222, #111);
        border-radius: 14px;
        border: 1px solid rgba(200, 169, 91, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #777;
        margin-bottom: 20px;
        text-transform: uppercase;
        font-weight: bold;
    }

    .product-card h3,
    .theme-content h3 {
        color: var(--logo-gold);
        margin-bottom: 12px;
        text-transform: uppercase;
    }

    .product-card p,
    .theme-content p {
        color: #ccc;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 20px;
    }

    .shopify-btn {
        border: 1px solid var(--logo-gold);
        color: var(--logo-gold);
        padding: 11px 22px;
        text-decoration: none;
        text-transform: uppercase;
        font-size: 13px;
        font-weight: bold;
        border-radius: 4px;
        display: inline-block;
        transition: 0.3s;
    }

    .shopify-btn:hover {
        background: var(--logo-gold);
        color: #000;
    }

    .theme-card {
        overflow: hidden;
    }

    .theme-display {
        height: 230px;
        background: #111;
        overflow: hidden;
    }

    .theme-display img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: opacity 0.6s ease-in-out;
    }

    .theme-content {
        padding: 25px;
    }

    .circle-rotator {
        display: flex;
        gap: 10px;
        margin-top: 15px;
        flex-wrap: wrap;
    }

    .circle-rotator span {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 1px solid var(--logo-gold);
        background: #222;
        display: inline-block;
    }

    .circle-rotator span.active {
        background: var(--logo-gold);
        box-shadow: 0 0 12px var(--logo-gold);
    }

    .footer {
        text-align: center;
        padding: 35px;
        background: var(--black);
        border-top: 1px solid rgba(200, 169, 91, 0.25);
        color: #aaa;
        font-size: 14px;
        line-height: 1.8;
    }

    @media(max-width: 900px) {
        .header-top {
            height: 78px;
            padding: 0 25px;
        }

        .logo {
            width: 150px;
        }

        .top-nav {
            display: none;
        }

        .category-bar {
            height: 44px;
            justify-content: flex-start;
            gap: 24px;
            overflow-x: auto;
            padding: 0 25px;
        }

        .hero {
            padding: 150px 25px 40px;
        }

        .hero-content {
            padding: 30px;
        }

        .hero-content h1 {
            font-size: 46px;
        }

        .hero-content p {
            font-size: 18px;
        }

        section {
            padding: 60px 25px;
        }
    }
</style>

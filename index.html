<script>
    const themeRotators = {
        honeycomb: {
            imageElement: document.getElementById("honeycombRotator"),
            images: [
                "Honeycomb/Honeycomb-1.png",
                "Honeycomb/Honeycomb-2.png",
                "Honeycomb/Honeycomb-3.png",
                "Honeycomb/Honeycomb-4.png",
                "Honeycomb/Honeycomb-5.png",
                "Honeycomb/Honeycomb-6.png",
                "Honeycomb/Honeycomb-7.png",
                "Honeycomb/Honeycomb-8.png",
                "Honeycomb/Honeycomb-9.png",
                "Honeycomb/Honeycomb-10.png",
                "Honeycomb/Honeycomb-11.png",
                "Honeycomb/Honeycomb-12.png",
                "Honeycomb/Honeycomb-13.png",
                "Honeycomb/Honeycomb-14.png"
            ],
            index: 0
        },

        topographic: {
            imageElement: document.getElementById("topographicRotator"),
            images: [
                "Topographic/Topographic-1.png",
                "Topographic/Topographic-2.png",
                "Topographic/Topographic-3.png",
                "Topographic/Topographic-4.png",
                "Topographic/Topographic-5.png",
                "Topographic/Topographic-6.png"
            ],
            index: 0
        },

        graffiti: {
            imageElement: document.getElementById("graffitiRotator"),
            images: [
                "Graffiti/Graffiti-1.png",
                "Graffiti/Graffiti-2.png",
                "Graffiti/Graffiti-3.png",
                "Graffiti/Graffiti-4.png",
                "Graffiti/Graffiti-5.png",
                "Graffiti/Graffiti-6.png",
                "Graffiti/Graffiti-7.png",
                "Graffiti/Graffiti-8.png"
            ],
            index: 0
        },

        camo: {
            imageElement: document.getElementById("camoRotator"),
            images: [
                "Camo/Camo-1.png",
                "Camo/Camo-2.png",
                "Camo/Camo-3.png",
                "Camo/Camo-4.png",
                "Camo/Camo-5.png",
                "Camo/Camo-6.png"
            ],
            index: 0
        },

        steel: {
            imageElement: document.getElementById("steelRotator"),
            images: [
                "Steel/steel-1.png",
                "Steel/steel-2.png",
                "Steel/steel-3.png",
                "Steel/steel-4.png",
                "Steel/steel-5.png",
                "Steel/steel-6.png",
                "Steel/steel-7.png",
                "Steel/steel-8.png"
            ],
            index: 0
        },

        patriotic: {
            imageElement: document.getElementById("patrioticRotator"),
            images: [
                "patriotic/patriotic-1.png",
                "patriotic/patriotic-2.png",
                "patriotic/patriotic-3.png",
                "patriotic/patriotic-4.png",
                "patriotic/patriotic-5.png"
            ],
            index: 0
        }
    };

    function updateDots(themeName, activeIndex) {
        const dots = document.querySelectorAll(
            `.circle-rotator[data-theme="${themeName}"] span`
        );

        dots.forEach((dot, index) => {
            dot.classList.toggle("active", index === activeIndex);
        });
    }

    function rotateTheme(themeName) {
        const rotator = themeRotators[themeName];

        if (!rotator || !rotator.imageElement) {
            return;
        }

        rotator.index++;

        if (rotator.index >= rotator.images.length) {
            rotator.index = 0;
        }

        rotator.imageElement.style.opacity = 0;

        setTimeout(() => {
            rotator.imageElement.src = rotator.images[rotator.index];
            rotator.imageElement.style.opacity = 1;
            updateDots(themeName, rotator.index);
        }, 400);
    }

    setInterval(() => {
        rotateTheme("honeycomb");
        rotateTheme("topographic");
        rotateTheme("graffiti");
        rotateTheme("camo");
        rotateTheme("steel");
        rotateTheme("patriotic");
    }, 10000);
</script>
